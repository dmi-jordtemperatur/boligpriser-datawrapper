name: Opdater grafer for fem byer

on:
  workflow_dispatch:
  schedule:
    # Den 1. i hver måned kl. 08.17 UTC
    - cron: "17 8 1 * *"

permissions:
  contents: write

jobs:
  opdater:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: python -m pip install requests

      - name: Hent priser for fem byer
        run: python hent_5_byer.py

      - name: Kontroller CSV-filer
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          for navn in ("villa_raekkehus", "ejerlejlighed", "fritidsbolig"):
              sti = Path(f"data/5_byer_{navn}.csv")
              with sti.open(encoding="utf-8", newline="") as fil:
                  reader = csv.DictReader(fil)
                  assert reader.fieldnames == [
                      "Dato", "København", "Aarhus", "Odense", "Aalborg", "Esbjerg"
                  ], f"Forkerte kolonner i {sti}"
                  rows = list(reader)
                  assert rows, f"Ingen måneder i {sti}"
                  print(f"Kontrolleret: {sti} – {len(rows)} måneder")
          PY

      - name: Gem CSV-filer på GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/5_byer_*.csv
          if ! git diff --cached --quiet; then
            git commit -m "Opdater boligprisgrafer for fem byer"
            git push
          else
            echo "Ingen dataændringer"
          fi
