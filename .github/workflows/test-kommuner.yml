
name: Opdater samlet boligtabel

on:
  workflow_dispatch:
  schedule:
    # Den 1. i hver måned kl. 08.17 UTC
    - cron: "17 8 1 * *"

permissions:
  contents: write

jobs:
  opdater:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: python -m pip install requests

      - name: Hent kommunedata
        run: python hent_kommuner.py

      - name: Kontroller CSV
        run: |
          python - <<'PY'
          import csv

          with open(
              "data/boligpriser_kommuner.csv",
              encoding="utf-8",
              newline=""
          ) as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 294, (
              f"Forventede 294 rækker, fik {len(rows)}"
          )

          print("Antal rækker:", len(rows))
          print(
              "Uden pris:",
              sum(not r["Kr. pr. m²"] for r in rows)
          )
          PY

      - name: Gem CSV på GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/boligpriser_kommuner.csv

          if ! git diff --cached --quiet; then
            git commit -m "Opdater kommunernes boligpriser"
            git push
          else
            echo "Ingen ændringer i boligpriserne"
          fi
