
name: Test boligpriser for kommuner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Hent projektet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Hent kommunedata
        run: python hent_kommuner.py

      - name: Kontroller resultat
        run: |
          echo "Antal datarækker:"
          python -c "import csv; print(sum(1 for _ in csv.DictReader(open('data/boligpriser_kommuner.csv'))))"
          echo "Antal rækker uden pris:"
          python -c "import csv; print(sum(not r['Kr. pr. m²'] for r in csv.DictReader(open('data/boligpriser_kommuner.csv'))))"

